[package]
name = "dotany-starter"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "dotany_starter_lib"
crate-type = ["rlib"]

[[bin]]
name = "dotany-starter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# the family's part: atomic saves, settings, the watcher, fonts, the platform layer and the window. A tool at the top of
# the repository writes path = "../../shared/rust".
[dependencies]
dotany-base = { path = "../../rust" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# a panic in an async command fails that command, not the whole program (crash.log keeps it); a plain sync command
# still ends it, and a lock the command held stays poisoned (shared/README.md, "A panic and the locks")
panic = "unwind"
strip = true
