[package]
name = "dotany-sheets"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "dotany_sheets_lib"
crate-type = ["rlib"]

[[bin]]
name = "dotany-sheets"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# the family's part: atomic saves, settings, the watcher, fonts, the platform layer and the window
[dependencies]
dotany-base = { path = "../../shared/rust" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the file formats: CSV and TSV encodings, writing XLSX, reading XLS and ODS. The hub's converter uses the same crate
dotany-table = { path = "../../shared/table" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
